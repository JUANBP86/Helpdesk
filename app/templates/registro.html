{% extends "base.html" %}
{% block title %}Crear cuenta Admin — Help Desk{% endblock %}

{% block content %}
<div class="auth-screen min-h-screen flex items-center justify-center p-4">
    <div class="auth-card bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/gotuplas.png" alt="Logo empresa" class="h-16 w-auto object-contain mx-auto">
            <p class="text-xs font-bold uppercase tracking-[.18em] text-teal-700 mt-5">Centro de soporte</p>
            <h1 class="text-2xl font-bold text-gray-800 mt-1">Configuración Inicial</h1>
            <p class="text-gray-500 text-sm mt-1">Crea la cuenta de administrador</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/registro" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
                <input type="text" name="nombre" required autofocus
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                       placeholder="Juan Pérez">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input type="email" name="email" required
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                       placeholder="admin@empresa.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                       placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                Crear Cuenta Admin
            </button>
        </form>
    </div>
</div>
{% endblock %}
